<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- respaldo para los navegadores que todavia ignoran el favicon en SVG -->
    <link rel="icon" type="image/png" sizes="96x96" href="/logo-96.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FAFAF7" />
    <meta
      name="description"
      content="REBOTEAPP: ranking ELO, partidos y torneos para jugadores amateur de padel en Cartagena."
    />
    <!-- Inter para leer, Space Grotesk solo para los numeros protagonistas -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- iOS: al agregar a la pantalla de inicio, abre en modo app y conserva
         la sesion en su propio almacenamiento -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="REBOTEAPP" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>REBOTEAPP</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
